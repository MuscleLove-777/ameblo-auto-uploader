name: Ameba Blog Auto Post

on:
  schedule:
    # 1日3回。各実行の間隔を4時間以上あける。
    - cron: '0 3 * * *'   # JST 12:00 (UTC 03:00)
    - cron: '0 9 * * *'   # JST 18:00 (UTC 09:00)
    - cron: '0 13 * * *'  # JST 22:00 (UTC 13:00)
  workflow_dispatch:
    inputs:
      check_auth_only:
        description: Check stored session expiry without starting uploads or notifications
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    env:
      GDRIVE_FOLDER_ID_AMEBLO: ${{ secrets.GDRIVE_FOLDER_ID_AMEBLO }}
      AMEBLO_USERNAME: ${{ secrets.AMEBLO_USERNAME }}
      AMEBLO_PASSWORD: ${{ secrets.AMEBLO_PASSWORD }}
      AMEBLO_COOKIE_ONLY: "1"
      AMEBLO_COOKIE_MIN_REMAINING_HOURS: "6"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Decode Ameblo cookies
        id: decode_cookies
        run: |
          if [ -z "$AMEBLO_COOKIES" ]; then
            echo "::error::AMEBLO_COOKIES is not configured; posting is blocked."
            exit 1
          fi
          printf '%s' "$AMEBLO_COOKIES" | base64 -d > ameblo_cookies.json
        env:
          AMEBLO_COOKIES: ${{ secrets.AMEBLO_COOKIES }}

      - name: Check Ameblo cookie freshness
        id: auth_check
        continue-on-error: true
        run: python upload.py --check-auth-only

      - name: Setup Chrome
        if: steps.auth_check.outcome == 'success' && github.event.inputs.check_auth_only != 'true'
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install dependencies
        if: steps.auth_check.outcome == 'success' && github.event.inputs.check_auth_only != 'true'
        run: pip install -r requirements.txt

      - name: Run upload script (attempt 1)
        id: attempt1
        if: steps.auth_check.outcome == 'success' && github.event.inputs.check_auth_only != 'true'
        continue-on-error: true
        run: |
          python upload.py \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage

      - name: Wait before retry
        if: steps.auth_check.outcome == 'success' && steps.attempt1.outcome == 'failure'
        run: echo "1回目失敗。60秒待ってリトライ..." && sleep 60

      - name: Run upload script (attempt 2)
        id: attempt2
        if: steps.auth_check.outcome == 'success' && steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: |
          python upload.py \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage

      - name: Wait before retry 2
        if: steps.auth_check.outcome == 'success' && steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: echo "2回目失敗。120秒待ってリトライ..." && sleep 120

      - name: Run upload script (attempt 3 - final)
        id: attempt3
        if: steps.auth_check.outcome == 'success' && steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          python upload.py \
            --headless \
            --no-sandbox \
            --disable-dev-shm-usage

      - name: Commit upload log
        id: commit_log
        if: steps.attempt1.outcome == 'success' || steps.attempt2.outcome == 'success' || steps.attempt3.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uploaded_ameblo.json
          git diff --cached --quiet || git commit -m "Update uploaded_ameblo.json [skip ci]"
          git pull --rebase origin master
          git push

      - name: LINE notify on failure
        id: notify_failure
        continue-on-error: true
        if: github.event.inputs.check_auth_only != 'true' && (steps.auth_check.outcome == 'failure' || (steps.attempt1.outcome == 'failure' && (steps.attempt2.outcome == 'failure' || steps.attempt2.outcome == 'skipped') && (steps.attempt3.outcome == 'failure' || steps.attempt3.outcome == 'skipped')))
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          if [ "${{ steps.auth_check.outcome }}" = "failure" ]; then
            python notify_line.py --outcome auth_failed
          else
            python notify_line.py --outcome unconfirmed
          fi

      - name: LINE notify on success
        id: notify_success
        continue-on-error: true
        if: github.event.inputs.check_auth_only != 'true' && (steps.attempt1.outcome == 'success' || steps.attempt2.outcome == 'success' || steps.attempt3.outcome == 'success')
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          ATTEMPT=1
          if [ "${{ steps.attempt2.outcome }}" = "success" ]; then
            ATTEMPT=2
          elif [ "${{ steps.attempt3.outcome }}" = "success" ]; then
            ATTEMPT=3
          fi
          python notify_line.py --outcome completed --attempt "$ATTEMPT"

      # 「緑なのに素通り」防止: 認証失敗(cookie失効)や投稿ゼロのときは
      # ジョブを赤(failure)にして気づけるようにする。
      - name: Mark job failed if nothing was posted
        if: always()
        env:
          CHECK_AUTH_ONLY: ${{ github.event.inputs.check_auth_only }}
        run: |
          if [ "${{ steps.auth_check.outcome }}" = "failure" ]; then
            echo "::error::Ameblo Cookie の期限確認に失敗。投稿処理は開始していません。認証更新が必要です。"
            exit 1
          fi
          if [ "${{ steps.auth_check.outcome }}" != "success" ]; then
            echo "::error::Ameblo の事前確認が未完了です。セットアップまたはCookie展開の失敗を確認してください。"
            exit 1
          fi
          if [ "$CHECK_AUTH_ONLY" = "true" ]; then
            echo 'AUTH_ONLY_PASS - Cookie preflight passed. No upload was started.'
            exit 0
          fi
          if [ "${{ steps.attempt1.outcome }}" != "success" ] && [ "${{ steps.attempt2.outcome }}" != "success" ] && [ "${{ steps.attempt3.outcome }}" != "success" ]; then
            echo "::error::Ameblo 投稿処理の正常完了を確認できません。再実行前に公開結果と台帳を照合してください。"
            exit 1
          fi
          echo "Ameblo post OK (auth_check=${{ steps.auth_check.outcome }})."

      - name: Record publishing and notification outcomes
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.auth_check.outcome }}
          ATTEMPT1_OUTCOME: ${{ steps.attempt1.outcome }}
          ATTEMPT2_OUTCOME: ${{ steps.attempt2.outcome }}
          ATTEMPT3_OUTCOME: ${{ steps.attempt3.outcome }}
          FAILURE_NOTIFY_OUTCOME: ${{ steps.notify_failure.outcome }}
          SUCCESS_NOTIFY_OUTCOME: ${{ steps.notify_success.outcome }}
          LEDGER_OUTCOME: ${{ steps.commit_log.outcome }}
          CHECK_AUTH_ONLY: ${{ github.event.inputs.check_auth_only }}
        run: |
          {
            echo '## Publishing outcome'
            if [ "$AUTH_OUTCOME" = 'failure' ]; then
              echo 'HOLD_AUTH - Cookie preflight failed. Upload attempts were not started.'
            elif [ "$AUTH_OUTCOME" != 'success' ]; then
              echo 'HOLD_SETUP: Preflight did not complete. Check setup and cookie decoding.'
            elif [ "$CHECK_AUTH_ONLY" = 'true' ]; then
              echo 'AUTH_ONLY_PASS - Cookie preflight passed. Uploads and notifications were not started.'
            elif [ "$ATTEMPT1_OUTCOME" = 'success' ] || [ "$ATTEMPT2_OUTCOME" = 'success' ] || [ "$ATTEMPT3_OUTCOME" = 'success' ]; then
              echo 'Upload script completed successfully. Confirm the public entry and ledger before treating delivery as verified.'
            else
              echo 'HOLD_RESULT: Upload completion was not confirmed. Reconcile public entries and ledger before retrying.'
            fi
            printf '\nLedger save: %s\n' "$LEDGER_OUTCOME"
            printf '\nLINE failure notification: %s\n' "$FAILURE_NOTIFY_OUTCOME"
            printf '\nLINE success notification: %s\n' "$SUCCESS_NOTIFY_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"
